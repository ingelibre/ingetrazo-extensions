[name]
es = "Render Studio"
en = "Render Studio"
pt = "Render Studio"

[summary]
es = "Renders fotográficos: estilos (día, hora dorada, maqueta blanca, interior, noche), fondo 360°, luces con IES, sol por lugar y hora, editor de materiales, vista previa en vivo, salida PNG a EXR; los proxies salen con su modelo completo."
en = "Photographic renders: looks (day, golden hour, white model, interior, night), 360° background, lights with IES, sun by place and hour, a material editor, a live preview, PNG to EXR output; proxies render as their full models."
pt = "Renders fotográficos: estilos (dia, hora dourada, maquete branca, interior, noite), fundo 360°, luzes com IES, sol por lugar e hora, editor de materiais, prévia ao vivo, saída PNG a EXR; os proxies saem com o modelo completo."

[description]
en = "Drives the Blender that IngeTrazo's Render tab already uses, with IngeTrazo's own scene script plus a look on top. Seven looks: clear day, partly cloudy, golden hour, overcast, white model, interior (Cycles) and night (stars, moonlit clouds). Each meters its exposure on a quick pre-render, with AgX, white balance, procedural clouds, a sun coloured by its height and distance haze; a 360° image (HDRI) can be the background and light the scene. Lights tab: point, spot, area and sun lights drawn in the view, ready-made lamps, lumens or watts, IES profiles, lights placed on objects that follow every copy. Sun tab: latitude and longitude (or a map), north, date and hour, shared with IngeTrazo's own shadows. Section tab: the drawing's active section plane cuts the render, closed with a cap of a material of the drawing. Output tab: sizes from HD to 4K and A4–A1 prints, PNG, JPEG, 16-bit PNG/TIFF, OpenEXR, transparent sky, saving every render. A material editor sets, per material, a preset, a type (glass, water with ripples, glowing…), roughness, metal, relief, glow and transparency, with an instant cube preview and an opacity map for cut-outs (black is transparent); a textured material renders with its whole texture set (normal, roughness, AO, displacement…) named in a .pbr.json file or by common file names. Proxies (light stand-ins whose full model is in an .igz of its own, as the «Proxies» and «Components manager» extensions make them) are rendered as their full models, each imported once and instanced. The preview window keeps a live view (camera about 3 frames a second, model changes about 1 s), renders the final picture and retouches it (exposure, contrast, saturation, warmth, vignette) without rendering again. Blender only runs when the user renders or opens the preview."
