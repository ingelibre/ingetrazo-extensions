[name]
es = "Render Studio"
en = "Render Studio"
pt = "Render Studio"

[summary]
es = "Renders tipo Enscape con un clic: estilos (día, nublado, hora dorada, maqueta blanca, interior, noche con estrellas), fondo 360° (HDRI), editor de materiales, exposición automática y ajustes en vivo."
en = "Enscape-like renders in one click: looks (day, overcast, golden hour, white model, interior, night with stars), 360° background (HDRI), a material editor, automatic exposure and live adjustments."
pt = "Renders estilo Enscape com um clique: estilos (dia, nublado, hora dourada, maquete branca, interior, noite com estrelas), fundo 360° (HDRI), editor de materiais, exposição automática e ajustes ao vivo."

[description]
en = "Drives the Blender that IngeTrazo's Render tab already uses, with IngeTrazo's own scene script plus a look on top. Seven looks: clear day, partly cloudy, golden hour, overcast, white model, interior (switches to Cycles) and night (stars, moonlit clouds, the document's lamps). Each one meters its exposure on a quick pre-render, uses AgX with white balance, procedural clouds, a sun coloured by its height and distance haze. A 360° image (HDRI) can be the background and light the scene. A simple material editor sets, per material, a preset, a type (generic, glass, water, glowing), roughness, metal, relief and glow, each optionally following a map (the picture in black and white, or an image file such as a normal map), saved in the document. The finished image opens in a window where exposure, contrast, saturation, warmth and vignette change instantly, without rendering again. EEVEE about 3 s, Cycles about 5 s on an RTX GPU."
