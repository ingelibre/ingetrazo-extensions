[summary]
es = "Renders fotográficos: estilos (día, hora dorada, maqueta blanca, interior, noche), fondo 360°, luces con IES, sol por lugar y hora, editor de materiales, vista previa en vivo, salida PNG a EXR; los proxies salen con su modelo completo."
en = "Photographic renders: looks (day, golden hour, white model, interior, night), 360° background, lights with IES, sun by place and hour, a material editor, a live preview, PNG to EXR output; proxies render as their full models."
pt = "Renders fotográficos: estilos (dia, hora dourada, maquete branca, interior, noite), fundo 360°, luzes com IES, sol por lugar e hora, editor de materiais, prévia ao vivo, saída PNG a EXR; os proxies saem com o modelo completo."

[description]
en = "Drives the Blender that IngeTrazo's Render tab already uses, with IngeTrazo's own scene script plus a look on top. Seven looks: clear day, partly cloudy, golden hour, overcast, white model, interior (Cycles) and night. Each meters its exposure, with AgX, white balance, clouds, a sun coloured by its height and distance haze. A 360° image (HDRI) can be the background and light the scene, and a panorama gets a sun at its brightest spot; its ground is projected from a viewpoint height, the generated ground can be switched off and the floor still catches a shadow. Lights tab: point, spot, area and sun lights drawn in the view, ready-made lamps, lumens or watts, IES profiles and lights placed on objects; they change in place in the live Blender. Sun tab: place (or a map), north, date and hour. Section tab: the section plane cuts the render, closed with a cap. Output tab: HD to 4K and A4–A1, PNG, JPEG, 16-bit PNG/TIFF, OpenEXR, transparent sky. A material editor sets, per material, a preset, a type (glass, water, glowing, grass…), roughness, metal, relief, glow and transparency, with an instant cube preview; click the cube to change its colour or picture, make an opacity map from the picture, edit the picture in another program and take it back when saved, and save or load materials. The eyedropper and «From the selection» find the material of an element inside a component. Proxies (light stand-ins whose full model is in an .igz of its own) render as their full models. What is hidden in the drawing stays out of the render. Render and «Render and save…» work straight from the panel; the preview window keeps a live view, uses Cycles when a big model is still, and retouches the final picture (exposure, contrast, saturation, warmth, vignette) without rendering again; «New scene from this view» saves a viewpoint. Expert mode opens the scene in Blender («Open in Blender…») to go on by hand."
