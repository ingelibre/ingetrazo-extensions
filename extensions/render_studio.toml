[name]
es = "Render Studio"
en = "Render Studio"
pt = "Render Studio"

[summary]
es = "Renders tipo Enscape con un clic: estilos (día, nublado, hora dorada, maqueta blanca, interior, noche con estrellas), exposición automática, nubes y ajustes en vivo."
en = "Enscape-like renders in one click: looks (day, overcast, golden hour, white model, interior, night with stars), automatic exposure, clouds and live adjustments."
pt = "Renders estilo Enscape com um clique: estilos (dia, nublado, hora dourada, maquete branca, interior, noite com estrelas), exposição automática, nuvens e ajustes ao vivo."

[description]
en = "Drives the Blender that IngeTrazo's Render tab already uses, with IngeTrazo's own scene script plus a look on top. Seven looks: clear day, partly cloudy, golden hour, overcast, white model, interior (switches to Cycles) and night (stars, moonlit clouds, the document's lamps). Each one meters its exposure on a quick pre-render, uses AgX with white balance, procedural clouds, a sun coloured by its height and distance haze. The finished image opens in a window where exposure, contrast, saturation, warmth and vignette change instantly, without rendering again. EEVEE about 3 s, Cycles about 5 s on an RTX GPU."
