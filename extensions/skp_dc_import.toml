[name]
es = "Componentes dinámicos de SketchUp"
en = "SketchUp Dynamic Components"
pt = "Componentes dinâmicos do SketchUp"

[summary]
es = "Abre .skp conservando los componentes dinámicos, cambia sus opciones y los redibuja como SketchUp, crea los tuyos y vuelve a guardarlos en .skp."
en = "Open .skp files keeping their dynamic components, change their options and redraw them as SketchUp does, make your own, and save them back to .skp."
pt = "Abre .skp mantendo os componentes dinâmicos, muda suas opções e os redesenha como o SketchUp, cria os seus e salva de volta em .skp."

[description]
en = "Imports a .skp with its component tree and each part's Dynamic Components attributes, formulas and options (a newer OpenSKP is bundled to read definition attributes). Component Options redraws a component as SketchUp's own engine does: copies, hidden parts, sizes, rotations, materials, LenX resizing. Component Attributes makes components dynamic and edits formulas per part. Export SketchUp (.skp) writes them back as working dynamic components (SketchUp 2017 format). Checked part by part against SketchUp 2026's redraw. Formula interpreter from d1rty-pixel's Dynamic Components. Note: .skp export uses OpenSKP's blank template, whose bytes came from Trimble's SketchUp SDK (see the README); import works without it."
