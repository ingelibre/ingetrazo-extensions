[name]
es = "Gestor de componentes"
en = "Components manager"
pt = "Gerenciador de componentes"

[summary]
es = "Los componentes del dibujo (selecciona todas las instancias, arrastra una copia a la vista), tus carpetas de modelos .igz y .skp vigiladas en tiempo real, y HDRI, materiales PBR completos y modelos 3D gratuitos de Poly Haven y ambientCG."
en = "The drawing's components (select every instance, drag a copy onto the view), your folders of .igz and .skp models watched in real time, and free HDRIs, full PBR materials and 3-D models from Poly Haven and ambientCG."
pt = "Os componentes do desenho (selecione todas as instâncias, arraste uma cópia para a vista), suas pastas de modelos .igz e .skp vigiadas em tempo real, e HDRIs, materiais PBR completos e modelos 3D gratuitos do Poly Haven e ambientCG."

[description]
en = "A tray tab with three pages. In drawing: every component once, with a preview and a count (dynamic ones marked; the parts inside a dynamic component are not listed); select every instance (also from the view's right-click menu); place a copy, or drag it onto the view. My catalog: folders of your own models, .igz and .skp (also inside .zip files), and material sets downloaded from any site; a .skp shows the preview it carries; each folder is watched in real time or read again with Update; insert by double-click or by dragging onto the view. A .skp comes in keeping its components and dynamic data when the «Parametric components from .skp» extension is installed, also when dragged from the file explorer. «Open a model site» opens, in the browser, the addresses you set. Online: CC0 assets from Poly Haven (HDRIs, materials, glTF models) and ambientCG (materials): an HDRI becomes Render Studio's 360° background, a material loads the paint bucket at its real size and comes with all its maps and a .pbr.json manifest that Render Studio uses, a model follows the cursor to be placed. Requests only reach each site's own servers over https (redirects checked); downloads are checked, cached in the extension's folder and reused."
