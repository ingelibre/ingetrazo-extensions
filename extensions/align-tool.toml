name = "Align Tool"
description = "Two-phase align tool for IngeTrazo. Pick a source anchor from six cube handles, click the same cube again to toggle per-object mode (green = whole-selection, purple = per-object), click a target object and pick its anchor, then press Enter. Only the source moves; every align is one undo step. Toggle the tool with Shift+S."
